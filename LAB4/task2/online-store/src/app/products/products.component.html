<h2>Products</h2>
<div class="search-container">
  <label for="search">Search products</label>
  <input
    id="search"
    type="text"
    placeholder="Search by product name..."
    [(ngModel)]="searchQuery"
    (input)="filterProducts()"
  />
</div>
<div *ngFor="let product of filteredProducts" style="border:1px solid #ccc; padding:10px; margin-bottom:10px;">
  <h3>{{ product.name }}</h3>
  <p>{{ product.description }}</p>
  <p><strong>Price:</strong> {{ product.price }} KZT</p>
  <p><strong>Rating:</strong> {{ product.rating }}</p>
  <img 
  [src]="product.image" 
  alt="{{ product.name }}" 
  style="width:200px; display:block; margin-bottom:10px;"
>
  <a [href]="product.link" target="_blank">
    View on Kaspi
  </a>
  <button (click)="shareWhatsApp(product)">
  Share on WhatsApp
</button>

<button (click)="shareTelegram(product)">
  Share on Telegram
</button>
</div>
